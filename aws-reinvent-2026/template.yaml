AWSTemplateFormatVersion: '2010-09-09'
Description: 'Close Copilot - month-end close with AI agents (Lambda Web Function UI, durable function, AgentCore agents, sandbox function, DynamoDB, S3, SNS, SQS)'

Parameters:
  CodeBucket: {Type: String}
  WorkflowKey: {Type: String}
  WebKey: {Type: String}
  SandboxKey: {Type: String}
  NotifierKey: {Type: String}
  Architecture: {Type: String, Default: arm64}
  ModelMode: {Type: String, Default: agentcore, AllowedValues: [agentcore, rules]}
  AgentRuntimeArn: {Type: String, Default: ''}
  AgentMode: {Type: String, Default: rules}

Resources:
  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: close-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: closeId, AttributeType: S}]
      KeySchema: [{AttributeName: closeId, KeyType: HASH}]

  PostingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: close-postings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: journalId, AttributeType: S}]
      KeySchema: [{AttributeName: journalId, KeyType: HASH}]

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: close-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: key, AttributeType: S}]
      KeySchema: [{AttributeName: key, KeyType: HASH}]

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties: {BucketName: close-documents}

  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties: {TopicName: close-notifications}

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties: {QueueName: close-notifications, VisibilityTimeout: 30}

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationsQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition: {ArnEquals: {'aws:SourceArn': !Ref NotificationsTopic}}

  NotificationsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationsQueue.Arn

  # One shared role keeps the demo short; scope it down per function for real use.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: close
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                  - dynamodb:*
                  - s3:*
                  - bedrock:InvokeModel
                  - bedrock:Converse
                  - bedrock-agentcore:InvokeAgentRuntime
                  - sns:Publish
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListDurableExecutionsByFunction
                  - lambda:CheckpointDurableExecution
                  - lambda:GetDurableExecutionState
                  - lambda:GetDurableExecutionHistory
                  - lambda:SendDurableExecutionCallbackSuccess
                  - lambda:SendDurableExecutionCallbackFailure
                Resource: '*'

  WorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: close-workflow
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 120
      Architectures: [!Ref Architecture]
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref WorkflowKey}
      DurableConfig: {ExecutionTimeout: 1800, RetentionPeriodInDays: 1}
      Environment:
        Variables:
          RUNS_TABLE: !Ref RunsTable
          CONFIG_TABLE: !Ref ConfigTable
          POSTINGS_TABLE: !Ref PostingsTable
          DOCS_BUCKET: !Ref DocsBucket
          NOTIFICATIONS_TOPIC: !Ref NotificationsTopic
          SANDBOX_FUNCTION: !Ref SandboxFunction
          MODEL_MODE: !Ref ModelMode
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          APPROVAL_TIMEOUT_SECONDS: '300'

  # The agent's code runs here: own role, read-only access to the feeds, nothing else.
  SandboxRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: read-feeds
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: ['logs:*'], Resource: '*'}
              - {Effect: Allow, Action: ['s3:GetObject'], Resource: !Sub 'arn:aws:s3:::${DocsBucket}/feeds/*'}

  SandboxFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: close-sandbox
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt SandboxRole.Arn
      Timeout: 60
      MemorySize: 512
      Architectures: [!Ref Architecture]
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref SandboxKey}

  NotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: close-notifier
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt FunctionRole.Arn
      Architectures: [!Ref Architecture]
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref NotifierKey}
      Environment: {Variables: {RUNS_TABLE: !Ref RunsTable}}

  NotifierMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotifierFunction
      EventSourceArn: !GetAtt NotificationsQueue.Arn
      BatchSize: 1

  # Lambda Web Function: a plain Node.js HTTP server (no event handler). The
  # function, its immutable revision (code + config) and the HTTPS endpoint are
  # three resources. The code zip must live in a versioning-enabled S3 bucket.
  WebFunction:
    Type: AWS::Lambda::WebFunction
    Properties:
      FunctionName: close-web

  WebRevision:
    Type: AWS::Lambda::WebFunctionRevision
    Properties:
      FunctionName: !Ref WebFunction
      Description: Close Copilot UI, API and SSE stream
      BuildConfig:
        RuntimeConfig: {Runtime: nodejs24.x}
        CodeConfig:
          S3Object: {Bucket: !Ref CodeBucket, Key: !Ref WebKey}
      ServiceConfig:
        ExecutionRoleArn: !GetAtt FunctionRole.Arn
        TimeoutSeconds: 300  # a stream may stay open this long; the browser reconnects
        EnvironmentVariables:
          RUNS_TABLE: !Ref RunsTable
          CONFIG_TABLE: !Ref ConfigTable
          DOCS_BUCKET: !Ref DocsBucket
          POSTINGS_TABLE: !Ref PostingsTable
          WORKFLOW_FUNCTION: !Ref WorkflowFunction
          AGENT_MODE: !Ref AgentMode
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn

  WebEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Properties:
      FunctionName: !Ref WebFunction
      EndpointName: default
      AuthType: ApplicationManaged  # public; the app owns authentication
      EndpointType: HomeRegion
      RevisionWeights:
        - {RevisionId: !GetAtt WebRevision.RevisionId, Weight: 100}

Outputs:
  WebDomain: {Value: !GetAtt WebEndpoint.DomainName}
